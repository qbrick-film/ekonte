# ブラウザ版を自動でビルドして、GitHub Pages に公開する。
# - タグ（v0.4.0 など）を push すると、組み立て → 動作確認 → GitHub Pages に公開まで行う
# - Actions タブの「Run workflow」で実行した場合は、Artifacts に置くだけ（公開しない）
# - アプリ版（PC版）の配布は v0.3.0 で終えた。アプリのプログラム（ekonte/gui.py・ekonte.spec・build_mac.sh など）は残してあり、
#   配布を戻すときは、この前の版のこのファイル（アプリを作る build と Releases に置く release の工程）を参考にする
#
# セキュリティ:
# - 権限は最小限。組み立て（外部のパッケージを入れて動かす工程）は読み取りだけで、GitHub Pages への公開は pages だけに渡す
# - 外部の Action はタグではなくコミットのハッシュで固定する（タグは付け替えられるため）。更新するときはハッシュごと差し替える
# - ブラウザ版に入れる部品（Pyodide など）は web/vendor.json に指紋（sha256）を固定してある
name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: タグとバージョン番号が一致しているか確認
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python3 -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('ekonte/__init__.py').read()).group(1))")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "タグ ${GITHUB_REF_NAME} と ekonte/__init__.py の $v が違います"; exit 1; }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      # アプリ版の画面の部品（PySide6）は、ブラウザ版の組み立てと比較に要らないので入れない
      - run: |
          grep -v -i "^pyside6" requirements.txt > "$RUNNER_TEMP/requirements-web.txt"
          pip install -r "$RUNNER_TEMP/requirements-web.txt"
      - run: python web/build.py dist-web
      - name: 動作確認（ブラウザ版の中身を Node で動かし、デスクトップ版と同じ Python の結果と一致するか比べる）
        timeout-minutes: 10
        run: |
          node web/test_engine.mjs dist-web "$RUNNER_TEMP/web-test"
          python web/compare.py dist-web "$RUNNER_TEMP/web-test"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: dist-web

  pages:
    needs: web
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write     # GitHub Pages への公開に必要（この工程だけ）
      id-token: write  # 公開先に、このワークフローからの依頼だと証明するために必要
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
